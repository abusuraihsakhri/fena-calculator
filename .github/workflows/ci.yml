name: Test and security checks
on:
  push:
    branches: [master, main, 'audit/**']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      AUDIT_SECRET_KEY: "ci-ephemeral-key-for-tests-only-not-production"
      MODEL_PROVIDER: "mock"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install HTTP test client
        run: python -m pip install 'httpx>=0.28.1'
      - name: Syntax check
        run: python -m compileall -q fena.py cli.py enrichment.py simulator.py agents tests
      - name: Python tests
        run: python -m pytest -q
      - name: Signed audit verification
        run: |
          python - <<'PY'
          from agents.base import AuditTrail
          trail = AuditTrail(secret_key="ephemeral-ci-test-key")
          entry = trail.log("ci", "test", "AUDIT_VERIFICATION", {"status": "OK"})
          assert trail.verify_integrity()
          entry["event_type"] = "TAMPERED"
          assert not trail.verify_integrity()
          PY
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check web/calculator.mjs
      - run: node --test tests/test_browser.mjs
